<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="joke-box">
            <h1>😂 Joke Generator 😂</h1>
            <p class="subtitle">Get a random laugh every time!</p>
            
            <div class="joke-content" id="jokeContent">
                <p id="jokeText">Click the button to get a joke!</p>
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="getJoke()">Get a Joke</button>
                <button class="btn btn-secondary" onclick="shareJoke()">Share</button>
                <button class="btn btn-secondary" onclick="copyJoke()">Copy</button>
            </div>
            
            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Loading joke...</p>
            </div>
            
            <p class="joke-counter">Jokes loaded: <span id="jokeCount">0</span></p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
